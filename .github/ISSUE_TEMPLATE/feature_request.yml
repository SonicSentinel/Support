name: Feature request
description: Suggest something Sonic Sentinel should do
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to be able to do?
      description: Describe what you are trying to achieve, not only the feature.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter to you?
  - type: input
    id: platform
    attributes:
      label: Which platform (macOS, iOS)?
